# GitGuardian configuration
#
# EnvDoctor's security suites deliberately feed the CLI distinctive,
# secret-looking values as TEST FIXTURES and assert those values never reach
# any output (stdout, stderr, JSON, logs, test failure messages, generated
# files). These values are not real credentials and MUST NOT be removed or
# weakened: AGENTS.md requires realistic secret values so non-disclosure is
# actually exercised.
#
# The fixtures below are ignored by SHA-256 of the secret value so that no
# real credential can ever be masked by this list. Plaintext is shown in
# comments solely for reviewability; the fixture values already appear
# verbatim in the test sources and testdata files checked into this
# repository.
#
# Schema: version 2, `secret.ignored_matches[].match` is the SHA-256 of the
# secret. See https://docs.gitguardian.com/ggshield-docs/configuration
version: 2

